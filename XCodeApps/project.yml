name: Silveran
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    watchOS: "10.0"
    tvOS: "17.0"
configs:
  Debug: debug
  Release: release
packages:
  Silveran:
    path: .
targetTemplates:
  appBase:
    type: application
    productName: "Silveran Reader"
    configFiles:
      Debug: XCodeApps/Configs/Debug.xcconfig
      Release: XCodeApps/Configs/Release.xcconfig
    settings:
      base:
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.1
        PRODUCT_NAME: Silveran Reader
        SWIFT_VERSION: 6.2

targets:
  Silveran Reader (macOS):
    templates:
      - appBase
    platform: macOS
    supportedDestinations: [macOS]
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: 15.0
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: XCodeApps/SilveranReaderMac.entitlements
        INFOPLIST_FILE: XCodeApps/Info-macOS.plist
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID)"
        #INFOPLIST_KEY_CFBundleDisplayName: Silveran Reader
        #INFOPLIST_KEY_CFBundleName: Silveran Reader
        # Unknown why this redundant definition is needed for XCode to honor the app name
        #SWIFT_UPCOMING_FEATURE_NONSENDING_NONISOLATING_BY_DEFAULT: YES
    info:
      path: XCodeApps/Info-macOS.plist
      properties:
        CFBundleName: "Silveran Reader"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundlePackageType: "$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        KEYCHAIN_ACCESS_GROUP: "$(KEYCHAIN_ACCESS_GROUP)"
        KEYCHAIN_SERVICE: "$(KEYCHAIN_SERVICE)"
        LSApplicationCategoryType: "public.app-category.books"
        NSLocalNetworkUsageDescription: "Silveran Reader needs local network access to connect to your Storyteller server."
        ITSAppUsesNonExemptEncryption: false
        ATSApplicationFontsPath: "fonts"
    sources:
      - path: XCodeApps
        includes:
          - "**/*.swift"
      - path: XCodeApps/Assets.xcassets
        type: assetcatalog
      - path: XCodeApps/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: Silveran
        product: SilveranAppleKit
      - package: Silveran
        product: SilveranContentServer
      - package: Silveran
        product: SilveranReadaloud

  Silveran Reader (iOS):
    templates:
      - appBase
    platform: iOS
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: 18.0
        CODE_SIGN_ENTITLEMENTS: XCodeApps/SilveranReaderIos.entitlements
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: XCodeApps/Info-iOS.plist
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID)"
        #INFOPLIST_KEY_CFBundleDisplayName: Silveran Reader
        #INFOPLIST_KEY_CFBundleName: Silveran Reader
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        #SWIFT_UPCOMING_FEATURE_NONSENDING_NONISOLATING_BY_DEFAULT: YES
    info:
      path: XCodeApps/Info-iOS.plist
      properties:
        CFBundleName: "Silveran Reader"
        CFBundleDisplayName: "Silveran Reader"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundlePackageType: "$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        KEYCHAIN_ACCESS_GROUP: "$(KEYCHAIN_ACCESS_GROUP)"
        KEYCHAIN_SERVICE: "$(KEYCHAIN_SERVICE)"
        LSApplicationCategoryType: "public.app-category.books"
        NSLocalNetworkUsageDescription: "Silveran Reader needs local network access to connect to your Storyteller server."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.kyonifer.silveran.progresssync.refresh
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: SilveranAppleKit.CarPlaySceneDelegate
    sources:
      - path: XCodeApps
        includes:
          - "**/*.swift"
      - path: XCodeApps/Assets.xcassets
        type: assetcatalog
      - path: XCodeApps/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: Silveran
        product: SilveranAppleKit
      - package: Silveran
        product: SilveranReadaloud
      - target: "Silveran Reader (watchOS)"
        embed: true
  Silveran Reader (watchOS):
    templates:
      - appBase
    platform: watchOS
    settings:
      base:
        WATCHOS_DEPLOYMENT_TARGET: 10.0
        CODE_SIGN_ENTITLEMENTS: XCodeApps/SilveranReaderWatch.entitlements
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: XCodeApps/Info-watchOS.plist
        PRODUCT_BUNDLE_IDENTIFIER: "$(WATCH_APP_BUNDLE_ID)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: XCodeApps/Info-watchOS.plist
      properties:
        CFBundleName: "Silveran Reader"
        CFBundleDisplayName: "Silveran Reader"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundlePackageType: "$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        KEYCHAIN_ACCESS_GROUP: "$(KEYCHAIN_ACCESS_GROUP)"
        KEYCHAIN_SERVICE: "$(KEYCHAIN_SERVICE)"
        WKApplication: true
        UIBackgroundModes:
          - audio
        WKCompanionAppBundleIdentifier: "$(APP_BUNDLE_ID)"
    sources:
      - path: XCodeApps/EntryPointStub.swift
      - path: XCodeApps/WatchAssets.xcassets
        type: assetcatalog
    dependencies:
      - package: Silveran
        product: SilveranAppleKit
  Silveran Reader (tvOS):
    templates:
      - appBase
    platform: tvOS
    settings:
      base:
        TVOS_DEPLOYMENT_TARGET: 17.0
        CODE_SIGN_ENTITLEMENTS: XCodeApps/SilveranReaderTV.entitlements
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: XCodeApps/Info-tvOS.plist
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID)"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon"
    info:
      path: XCodeApps/Info-tvOS.plist
      properties:
        CFBundleName: "Silveran Reader"
        CFBundleDisplayName: "Silveran Reader"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundlePackageType: "$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        KEYCHAIN_ACCESS_GROUP: "$(KEYCHAIN_ACCESS_GROUP)"
        KEYCHAIN_SERVICE: "$(KEYCHAIN_SERVICE)"
        LSApplicationCategoryType: "public.app-category.books"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Automatic
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
    sources:
      - path: XCodeApps/EntryPointStub.swift
      - path: XCodeApps/TVAssets.xcassets
        type: assetcatalog
    dependencies:
      - package: Silveran
        product: SilveranAppleKit
schemes:
  "Silveran Reader (macOS)":
    shared: true
    build:
      targets:
        "Silveran Reader (macOS)": all
    run:
      config: Debug
      executable: "Silveran Reader (macOS)"
    test:
      config: Debug
      targets: []
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  "Silveran Reader (iOS)":
    shared: true
    build:
      targets:
        "Silveran Reader (iOS)": all
        "Silveran Reader (watchOS)": all
    run:
      config: Debug
      executable: "Silveran Reader (iOS)"
    test:
      config: Debug
      targets: []
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  "Silveran Reader (watchOS)":
    shared: true
    build:
      targets:
        "Silveran Reader (watchOS)": all
    run:
      config: Debug
      executable: "Silveran Reader (watchOS)"
    test:
      config: Debug
      targets: []
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  "Silveran Reader (tvOS)":
    shared: true
    build:
      targets:
        "Silveran Reader (tvOS)": all
    run:
      config: Debug
      executable: "Silveran Reader (tvOS)"
    test:
      config: Debug
      targets: []
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
